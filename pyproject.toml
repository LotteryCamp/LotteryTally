[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pocketledger"
version = "0.1.0"
description = "PocketLedger 口袋账本 —— 福州大学 2026 软件工程现场编程项目：本地优先的个人收支记账本"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "鹦伟达团队" }]
keywords = ["flask", "ledger", "accounting", "json", "local-first"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: Flask",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "Flask>=3.0,<4.0",
]

[project.optional-dependencies]
# 测试只用标准库 unittest，不需要额外依赖
dev = []

[project.scripts]
pocketledger = "lotterytally.app:main"
pocketledger-demo = "lotterytally.demo_data:main"

[project.urls]
Repository = "https://github.com/LotteryCamp/LotteryTally"

[tool.setuptools]
packages = ["lotterytally"]
include-package-data = true

[tool.setuptools.package-data]
lotterytally = ["templates/*.html", "static/css/*.css", "static/js/*.js"]
